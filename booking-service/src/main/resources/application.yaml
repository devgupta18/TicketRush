spring:
  application:
    name: booking-service
  datasource:
    url: jdbc:postgresql://localhost:5432/ticketrush
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: localhost
      port: 6379
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  booking:
    seat-lock:
      ttl-seconds: 300
  jwt:
    secret: ${JWT_SECRET}
    expiration: 3600000  # 1 hour, in milliseconds